name: Build & Publish NuGet Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SharedKernel.slnx

      - name: Build solution
        run: dotnet build SharedKernel.slnx --configuration Release --no-restore

      - name: Pack NuGet Packages
        run: dotnet pack SharedKernel.slnx --configuration Release --output ./nupkgs

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/cedricmeleard/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
