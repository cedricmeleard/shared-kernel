name: Build, Test & Publish SharedKernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Determine Next SemVer Version
        id: semver
        shell: bash
        run: |
          git fetch --tags --force || true
          
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          VERSION=${LATEST_TAG#v}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # Inspect PR title, body, or commit message
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title || github.event.pull_request.body }}"
          
          if [[ "$COMMIT_MSG" == *"semver:major"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSG" == *"semver:minor"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Current latest tag: $LATEST_TAG"
          echo "Commit / PR Message: $COMMIT_MSG"
          echo "Increment type: $BUMP_TYPE"
          echo "Calculated new version: $NEW_VERSION"
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore SharedKernel.slnx

      - name: Build solution
        run: dotnet build SharedKernel.slnx --configuration Release -p:Version=${{ env.NEW_VERSION }}

      - name: Run Unit Tests
        run: dotnet test SharedKernel.slnx --configuration Release --no-build

      - name: Pack NuGet Packages
        run: dotnet pack SharedKernel.slnx --configuration Release --output ./nupkgs -p:Version=${{ env.NEW_VERSION }}

      - name: Publish to GitHub Packages (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet nuget push "./nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/cedricmeleard/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Create Git Tag & Release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ env.NEW_VERSION }}" -m "Release v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"
          gh release create "v${{ env.NEW_VERSION }}" ./nupkgs/*.nupkg --title "Release v${{ env.NEW_VERSION }}" --notes "Automated release of SharedKernel v${{ env.NEW_VERSION }}"
